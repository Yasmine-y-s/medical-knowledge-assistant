name: CI

on:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: mka
          POSTGRES_PASSWORD: mka
          POSTGRES_DB: medical_knowledge_assistant_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U mka"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=5

    env:
      SECRET_KEY: ci-test-secret-key
      OPENAI_API_KEY: sk-fake-key-not-used-in-ci
      DATABASE_URL: postgresql+psycopg2://mka:mka@localhost:5432/medical_knowledge_assistant_test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Enable pgvector extension
        run: PGPASSWORD=mka psql -h localhost -U mka -d medical_knowledge_assistant_test -c "CREATE EXTENSION IF NOT EXISTS vector;"

      - name: Run tests
        run: pytest

      - name: Run linter
        run: |
          pip install ruff
          ruff check .

      - name: Build Docker image
        run: docker build -t medical-knowledge-assistant .
